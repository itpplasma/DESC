name: Weekly tests

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  unit_tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        combos: [{group: 1, python_version: '3.10'}, {group: 2, python_version: '3.11'}, {group: 3, python_version: '3.12'}, {group: 4, python_version: '3.13'}]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.combos.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.combos.python_version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r devtools/dev-requirements.txt
          pip install matplotlib==3.10.8
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4
      - name: Test with pytest
        run: |
          pwd
          lscpu
          pip list
          python -m pytest -v -m unit \
            --durations=0 \
            --splits 4 \
            --group ${{ matrix.combos.group }} \
            --splitting-algorithm least_duration
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || github.event_name == 'schedule'

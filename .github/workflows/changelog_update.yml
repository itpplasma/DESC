name: Check changelog updated

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, labeled, unlabeled]
  merge_group:
  push:
    branches:
      - main

jobs:
  check_changelog_updated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            has_changes:
              - 'desc/**'
              - 'requirements.txt'
              - 'requirements_conda.yml'
              - '.github/workflows/changelog_update.yml'

      - name: Check for relevant changes
        id: check_changes
        run: echo "has_changes=${{ steps.changes.outputs.has_changes }}" >> $GITHUB_ENV

      - if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip_changelog') && env.has_changes == 'true'}}
        uses: danieljimeneznz/ensure-files-changed@v4.1.1
        with:
          require-changes-to: |
            CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check changelog for merge group or push
        if: ${{ (github.event_name == 'merge_group' || github.event_name == 'push') && env.has_changes == 'true' }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- CHANGELOG.md)
          if [ -z "$changed" ]; then
            echo "::error::Relevant changes require an update to CHANGELOG.md"
            exit 1
          fi
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
